services:
  apiserver:
    image: "${LOADTEST_APISERVER_IMAGE:-ghcr.io/dependencytrack/apiserver:5-snapshot@sha256:31581bd5a2c577b1eeebce509018a3937934ffb25af35f4a7cb8d05c25075442}"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "4"
          memory: 4g
    environment:
      DT_METRICS_ENABLED: "true"
      DT_SECRET_MANAGEMENT_DATABASE_KEK: "${LOADTEST_KEK:?}"
      DT_DEX_ENGINE_ACTIVITY_WORKER_PACKAGE_METADATA_RESOLUTION_ENABLED: "false"
      DT_TASK_SCHEDULER_ENABLED: "false"
    ports:
    - "127.0.0.1:18080:8080"
    - "127.0.0.1:19000:9000"
    restart: "no"

  postgres:
    image: "postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    # PGTune inputs:
    #
    # - DB Version:     18
    # - OS Type:        Linux
    # - DB Type:        Online Transaction Processing System
    # - Total Memory:   8GB
    # - Number of CPUs: 4
    # - Connections:    60
    # - Data Storage:   SSD
    #
    # wal_compression and default_toast_compression follow the database guide's advanced tuning.
    command: >-
      -c max_connections=60
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c maintenance_io_concurrency=200
      -c work_mem=32MB
      -c huge_pages=try
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c max_parallel_maintenance_workers=2
      -c jit=off
      -c wal_compression=zstd
      -c default_toast_compression=lz4
    ports: !override []
    restart: "no"

  k6:
    image: "grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8"
    profiles: [ tools ]
    volumes:
    - "..:/src:ro"
    - "./loadtest/results:/results"
    restart: "no"
